<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập Social</title>
    <!-- Sử dụng Tailwind CSS qua CDN để tạo giao diện nhanh gọn -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-sm text-center">
        <h2 class="text-2xl font-bold text-gray-800 mb-6">Đăng Nhập</h2>

        <!-- Giao diện khi CHƯA đăng nhập -->
        <div id="login-section" class="flex flex-col space-y-4">
            <button id="btn-google"
                class="flex items-center justify-center w-full px-4 py-2 border border-gray-300 rounded-lg hover:bg-gray-50 transition duration-200 shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5 mr-3" alt="Google">
                <span class="text-gray-700 font-medium">Đăng nhập với Google</span>
            </button>

            <button id="btn-github"
                class="flex items-center justify-center w-full px-4 py-2 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition duration-200 shadow-sm">
                <img src="https://www.svgrepo.com/show/512317/github-142.svg" class="w-5 h-5 mr-3 invert" alt="GitHub">
                <span class="font-medium">Đăng nhập với GitHub</span>
            </button>
        </div>

        <!-- Giao diện khi ĐÃ đăng nhập -->
        <div id="profile-section" class="hidden flex-col items-center mt-2">
            <img id="user-avatar" src="" alt="Avatar"
                class="w-20 h-20 rounded-full border-2 border-indigo-500 mb-4 shadow-sm object-cover">
            <h3 id="user-name" class="text-lg font-bold text-gray-800"></h3>
            <p id="user-email" class="text-sm text-gray-500 mb-6"></p>
            <button id="btn-logout"
                class="px-6 py-2 bg-red-500 text-white rounded-lg hover:bg-red-600 transition duration-200 font-medium shadow-sm">
                Đăng xuất
            </button>
        </div>
    </div>

    <!-- Tích hợp Firebase SDK (Phiên bản Modular v10) -->
    <script type="module">
        // Import the functions you need from the SDKs you need
        import { initializeApp } from "firebase/app";
        import { getAnalytics } from "firebase/analytics";
        // TODO: Add SDKs for Firebase products that you want to use
        // https://firebase.google.com/docs/web/setup#available-libraries

        // Your web app's Firebase configuration
        // For Firebase JS SDK v7.20.0 and later, measurementId is optional
        const firebaseConfig = {
            apiKey: "AIzaSyAJOu_6ASL08bRO5RlLQvXElXeyCJL0Kc0",
            authDomain: "testloginnhom7.firebaseapp.com",
            projectId: "testloginnhom7",
            storageBucket: "testloginnhom7.firebasestorage.app",
            messagingSenderId: "392071378949",
            appId: "1:392071378949:web:654b235223996e6f29446c",
            measurementId: "G-TCN3TP43J5"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);

        // Khởi tạo Providers
        const googleProvider = new GoogleAuthProvider();
        const githubProvider = new GithubAuthProvider();

        // Lấy các phần tử DOM
        const loginSection = document.getElementById('login-section');
        const profileSection = document.getElementById('profile-section');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        const userAvatar = document.getElementById('user-avatar');

        // Hàm cập nhật UI dựa trên trạng thái đăng nhập
        const updateUI = (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                profileSection.classList.remove('hidden');
                profileSection.classList.add('flex');

                userName.textContent = user.displayName || 'Người dùng ẩn danh';
                userEmail.textContent = user.email || 'Không có email công khai';
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/150';
            } else {
                loginSection.classList.remove('hidden');
                profileSection.classList.add('hidden');
                profileSection.classList.remove('flex');
            }
        };

        // Lắng nghe trạng thái đăng nhập/đăng xuất
        onAuthStateChanged(auth, (user) => {
            updateUI(user);
        });

        // Xử lý sự kiện click Đăng nhập Google
        document.getElementById('btn-google').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Đăng nhập Google thất bại!");
            }
        });

        // Xử lý sự kiện click Đăng nhập GitHub
        document.getElementById('btn-github').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, githubProvider);
            } catch (error) {
                console.error("Lỗi:", error);
                alert("Đăng nhập GitHub thất bại!");
            }
        });

        // Xử lý sự kiện click Đăng xuất
        document.getElementById('btn-logout').addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Lỗi:", error);
            }
        });
    </script>
</body>

</html>
