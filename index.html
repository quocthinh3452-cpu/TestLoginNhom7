<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xây Dựng Phần Mềm Web - Nhóm 7</title>
    <!-- Tailwind CSS qua CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="w-full max-w-md bg-white/95 backdrop-blur-md rounded-3xl shadow-2xl border border-white/20 p-8 transition-all duration-300">
        
        <!-- Header Môn Học & Nhóm -->
        <div class="text-center mb-6">
            <span class="inline-block px-3 py-1 bg-indigo-100 text-indigo-700 text-xs font-bold rounded-full uppercase tracking-wider mb-2">
                Môn: Xây Dựng Phần Mềm Web
            </span>
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">NHÓM 7</h1>
            <p class="text-xs text-gray-500 mt-1">Báo cáo bài tập Đăng nhập Social (Firebase Auth)</p>
        </div>

        <hr class="border-gray-200 mb-6">

        <!-- ================= GIAO DIỆN CHƯA ĐĂNG NHẬP ================= -->
        <div id="login-section" class="space-y-4">
            <p class="text-sm font-medium text-gray-600 text-center mb-4">Vui lòng chọn phương thức đăng nhập</p>

            <button id="btn-google"
                class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-white border border-gray-300 rounded-xl font-medium text-gray-700 hover:bg-gray-50 hover:border-gray-400 active:scale-[0.98] transition-all shadow-sm">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="Google">
                <span>Đăng nhập với Google</span>
            </button>

            <button id="btn-github"
                class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-gray-900 rounded-xl font-medium text-white hover:bg-gray-800 active:scale-[0.98] transition-all shadow-md">
                <img src="https://www.svgrepo.com/show/512317/github-142.svg" class="w-5 h-5 invert" alt="GitHub">
                <span>Đăng nhập với GitHub</span>
            </button>

            <!-- Thông tin thành viên nhóm -->
            <div class="mt-8 pt-6 border-t border-gray-100">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider text-center mb-3">Danh sách thành viên</h3>
                <div class="bg-gray-50 rounded-2xl p-4 text-xs space-y-2 border border-gray-100">
                    <div class="flex justify-between items-center">
                        <span class="font-semibold text-gray-800">Hồ Quốc Thịnh</span>
                        <span class="text-indigo-600 font-mono bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">MSSV: DH52201492</span>
                        <span class="font-semibold text-gray-800">Đới Công LUận</span>
                        <span class="text-indigo-600 font-mono bg-indigo-50 px-2 py-0.5 rounded border border-indigo-100">MSSV: DH52201039</span>
                    </div>
                    <!-- Bạn có thể thêm các thành viên khác vào đây nếu có -->
                </div>
            </div>
        </div>

        <!-- ================= GIAO DIỆN ĐÃ ĐĂNG NHẬP ================= -->
        <div id="profile-section" class="hidden flex-col items-center text-center">
            <div class="relative mb-4">
                <img id="user-avatar" src="" alt="Avatar"
                    class="w-24 h-24 rounded-full border-4 border-indigo-500/30 p-1 shadow-lg object-cover">
                <span class="absolute bottom-1 right-1 bg-green-500 w-4 h-4 rounded-full border-2 border-white" title="Online"></span>
            </div>

            <h2 id="user-name" class="text-xl font-bold text-gray-800"></h2>
            <p id="user-email" class="text-sm text-gray-500 font-mono mt-0.5 mb-5"></p>

            <!-- Thẻ thông tin dự án -->
            <div class="w-full bg-indigo-50/70 border border-indigo-100 rounded-2xl p-4 text-left text-xs space-y-2 mb-6 text-gray-600">
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">Môn học:</span>
                    <span class="font-semibold text-indigo-900">Xây dựng phần mềm Web</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">Nhóm thực hiện:</span>
                    <span class="font-semibold text-indigo-900">Nhóm 7</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-gray-500">Trạng thái:</span>
                    <span class="px-2 py-0.5 bg-green-100 text-green-700 font-bold rounded-full text-[10px]">Đã xác thực thành công</span>
                </div>
            </div>

            <button id="btn-logout"
                class="w-full py-3 bg-red-500 hover:bg-red-600 text-white font-medium rounded-xl transition-all shadow-md active:scale-[0.98]">
                Đăng xuất
            </button>
        </div>

    </div>

    <!-- Tích hợp Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            GoogleAuthProvider, 
            GithubAuthProvider, 
            signInWithPopup, 
            onAuthStateChanged, 
            signOut 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Cấu hình Firebase dự án TestLoginNhom7
        const firebaseConfig = {
            apiKey: "AIzaSyAJOu_6ASL08bRO5RlLQvXElXeyCJL0Kc0",
            authDomain: "testloginnhom7.firebaseapp.com",
            projectId: "testloginnhom7",
            storageBucket: "testloginnhom7.firebasestorage.app",
            messagingSenderId: "392071378949",
            appId: "1:392071378949:web:654b235223996e6f29446c",
            measurementId: "G-TCN3TP43J5"
        };

        // Khởi tạo Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const googleProvider = new GoogleAuthProvider();
        const githubProvider = new GithubAuthProvider();

        // Lấy DOM Elements
        const loginSection = document.getElementById('login-section');
        const profileSection = document.getElementById('profile-section');
        const userName = document.getElementById('user-name');
        const userEmail = document.getElementById('user-email');
        const userAvatar = document.getElementById('user-avatar');

        // Hàm cập nhật UI
        const updateUI = (user) => {
            if (user) {
                loginSection.classList.add('hidden');
                profileSection.classList.remove('hidden');
                profileSection.classList.add('flex');

                userName.textContent = user.displayName || 'Người dùng ẩn danh';
                userEmail.textContent = user.email || 'Không có email công khai';
                userAvatar.src = user.photoURL || 'https://via.placeholder.com/150';
            } else {
                loginSection.classList.remove('hidden');
                profileSection.classList.add('hidden');
                profileSection.classList.remove('flex');
            }
        };

        // Lắng nghe sự thay đổi trạng thái Auth
        onAuthStateChanged(auth, (user) => {
            updateUI(user);
        });

        // Đăng nhập Google
        document.getElementById('btn-google').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch (error) {
                console.error("Lỗi Google Auth:", error);
                alert("Đăng nhập Google thất bại: " + error.message);
            }
        });

        // Đăng nhập GitHub
        document.getElementById('btn-github').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, githubProvider);
            } catch (error) {
                console.error("Lỗi GitHub Auth:", error);
                alert("Đăng nhập GitHub thất bại: " + error.message);
            }
        });

        // Đăng xuất
        document.getElementById('btn-logout').addEventListener('click', async () => {
            try {
                await signOut(auth);
            } catch (error) {
                console.error("Lỗi Đăng xuất:", error);
            }
        });
    </script>
</body>

</html>
